# 复制为 config/application-dev.yaml，再显式激活 dev 环境。
# 本地副本被 Git 忽略，且不打入 JAR；不要将真实配置填进本模板。
server:
  port: 8080

app:
  qa:
    enabled: false
    base-url: "<DASHSCOPE_OPENAI_COMPATIBLE_BASE_URL>"
    api-key: "<DASHSCOPE_API_KEY>"
  parse:
    # 准备好 RocketMQ、FFmpeg、Tesseract 中文语言数据与百炼 ASR 后开启。
    enabled: false
    nameserver: "<ROCKETMQ_NAMESERVER_HOST_PORT>"
    ffmpeg-command: "<FFMPEG_EXECUTABLE>"
    ffprobe-command: "<FFPROBE_EXECUTABLE>"
    ocr-command: "<TESSERACT_EXECUTABLE>"
    asr-url: "<DASHSCOPE_NON_STREAMING_ASR_ENDPOINT>"
    asr-model: "qwen-audio-3.1-asr-flash"
    asr-api-key: "<DASHSCOPE_API_KEY>"
  upload:
    # 填写并准备好三项外部服务后改成 true。
    enabled: false
  storage:
    endpoint: "<MINIO_ENDPOINT>"
    access-key: "<MINIO_ACCESS_KEY>"
    secret-key: "<MINIO_SECRET_KEY>"
    bucket: "<DEDICATED_VIDEO_BUCKET>"

spring:
  datasource:
    # 先建立本项目独立的空数据库；Flyway 仅在该库中创建上传与解析表。
    url: "<MYSQL_JDBC_URL>"
    username: "<MYSQL_USERNAME>"
    password: "<MYSQL_PASSWORD>"
  data:
    redis:
      host: "<REDIS_HOST>"
      port: 6379
      database: 0
      password: "<REDIS_PASSWORD>"
      timeout: 3s

# 本轮仅接入语音转写，未接入总结或 Agent。
