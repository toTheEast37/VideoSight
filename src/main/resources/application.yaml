spring:
  application:
    name: vibeteaching
  servlet:
    multipart:
      enabled: false

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 开发暂用参数，可调整；不代表已验证 2 GiB 文件。
app:
  qa:
    enabled: false
    embedding-model: qwen3.7-text-embedding-flash
    answer-model: qwen-flash
    timeout: 20s
  parse:
    enabled: false
    profile-version: v1
    max-duration: 30m
    max-input-bytes: 268435456
    audio-segment-seconds: 60
    frame-interval-seconds: 5
    max-frames: 360
    temp-directory: work/parse-tmp
    process-timeout: 5m
    asr-timeout: 3m
    lease-duration: 5m
    requeue-after: 10m
    max-attempts: 3
    retry-delay: 10s
  upload:
    enabled: false
    chunk-size: 5242880
    max-file-size: 2147483648
    max-rounds: 3
    concurrency: 3
    request-timeout-ms: 60000
    retry-delay-ms: 1000
    session-ttl: 24h
    temp-directory: work/upload-tmp
    cleanup-delay-ms: 600000
