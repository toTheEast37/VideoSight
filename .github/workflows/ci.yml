name: 构建与视频功能检查

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Java 构建与前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Java 17 与 Maven 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 配置 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 构建并运行 Java 检查
        run: bash ./mvnw --batch-mode verify

      - name: 运行前端上传与解析检查
        run: node --test src/test/js/upload-core.test.mjs src/test/js/parse-core.test.mjs
